[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnrise-backend"
version = "0.1.0"
description = "LearnRise backend service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary,pool]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.2,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.1,<5.0",
    "cryptography>=42,<45",
    "httpx>=0.27,<1.0",
    "apscheduler>=3.10,<4.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "minio>=7.2,<8.0",
    "aiosmtpd>=1.4,<2.0",
    "jinja2>=3.1,<4.0",
    "email-validator>=2.1,<3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
]
# Huawei Cloud SDKs are optional and intentionally NOT installed by default.
huawei = [
    "esdk-obs-python>=3.23",
    "huaweicloudsdkocr>=3.1",
    "huaweicloudsdkcore>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_huawei: contract test that needs Huawei Cloud credentials (HUAWEI_AK/HUAWEI_SK)",
]
