<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232e7cf6'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='Georgia'%3EL%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnRise - 学习竞赛平台</title>
    <script>
      // 首屏同步应用主题，避免深色用户看到浅色闪烁；无存储时默认浅色
      ;(function () {
        try {
          var raw = window.localStorage.getItem('learnrise.ui')
          var prefs = raw ? JSON.parse(raw) : null
          var theme = prefs && prefs.theme
          var resolved = theme === 'light' || theme === 'dark' || theme === 'system' ? theme : 'light'
          if (
            resolved === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            resolved = 'dark'
          }
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.density =
            prefs && prefs.compact_tables === true ? 'compact' : 'normal'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.density = 'normal'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
