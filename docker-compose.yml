name: learnrise

services:
  db:
    image: pgvector/pgvector:0.8.0-pg15
    environment:
      POSTGRES_USER: learnrise
      POSTGRES_PASSWORD: learnrise
      POSTGRES_DB: learnrise
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnrise -d learnrise"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: learnrise-backend:latest
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://learnrise:learnrise@db:5432/learnrise}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mock-local}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mock-hash}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-var/storage}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-learnrise}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      OBS_ACCESS_KEY_ID: ${OBS_ACCESS_KEY_ID:-}
      OBS_SECRET_ACCESS_KEY: ${OBS_SECRET_ACCESS_KEY:-}
      OBS_ENDPOINT: ${OBS_ENDPOINT:-}
      OBS_BUCKET: ${OBS_BUCKET:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr-service:8001}
      HUAWEI_AK: ${HUAWEI_AK:-}
      HUAWEI_SK: ${HUAWEI_SK:-}
      HUAWEI_PROJECT_ID: ${HUAWEI_PROJECT_ID:-}
      HUAWEI_REGION: ${HUAWEI_REGION:-cn-north-4}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-dev-only-fernet-key-change-me-32bytes=}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      CRON_SIGNATURE_SECRET: ${CRON_SIGNATURE_SECRET:-dev-only-cron-secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5174}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ocr-service:
    image: learnrise-ocr-service:latest
    build:
      context: ./ocr-service
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    ports:
      - "8001:8001"
    volumes:
      - ./ocr-service:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status == 200 else 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:5174/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:80/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  minio_data:
