repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: legacy-name
        name: legacy-name gate
        entry: scripts/check_legacy_name.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: repo-hygiene
        name: repo-hygiene gate
        entry: scripts/check_repo_hygiene.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: adapter-isolation
        name: adapter-isolation gate
        entry: scripts/check_import_isolation.sh
        language: script
        pass_filenames: false
        always_run: true
