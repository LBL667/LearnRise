# LearnRise —— 单栈 compose 的入口 nginx
#
# 挂载为 /etc/nginx/conf.d/default.conf（nginx:alpine）。
# 本地 dev 拓扑：nginx:8080 → frontend(Vite dev server) + backend(FastAPI)。
#
# 三条硬约束：
#   1. Vite dev server 没有构建产物，/ 必须反代到 frontend:5174，不能走静态文件；
#   2. HMR 依赖 websocket，/ 需要透传 Upgrade/Connection；
#   3. SSE（逐 token 输出）必须 proxy_buffering off + gzip off，否则会攒成一整块。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传上限与后端 MAX_UPLOAD_MB=20 留出余量。
    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- SSE：知识点讲解 ------------------------------------------------
    # 正则 location 优先于 /api/ 前缀匹配，命中后不会再走下面的通用 API。
    location ~ ^/api/knowledge-points/[^/]+/explain$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    # ---- SSE：Agent 会话流（路由上线后自动生效，无需再改 nginx）----------
    location ~ ^/api/assistant/conversations/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    # ---- 通用 API --------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        gzip off;
    }

    # ---- Vite dev server（含 HMR websocket）------------------------------
    location / {
        proxy_pass http://frontend:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
