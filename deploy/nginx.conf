# LearnRise —— 生产 nginx（TLS 终止 + 静态 SPA + /api 反代）
#
# 挂载为 /etc/nginx/nginx.conf（deploy/Dockerfile.web 已内置）。
# 关键约束：
#   1. /api 关闭 gzip，避免代理层压缩破坏 SSE 分帧；
#   2. /api/knowledge-points/<id>/explain 显式 proxy_buffering off / proxy_cache off，
#      并下发 X-Accel-Buffering: no —— 任何缓冲都会把逐 token 输出攒成一整块；
#   3. SSE 只经过 ECS 上的 nginx 直连后端，绝不经过 CDN / OBS（见 docs/deploy.md）。
#
# server_name 保持 `_`（catch-all）；证书 CN/SAN 由 certbot 按 DOMAIN 签发，
# 如需严格 vhost 匹配，可在部署时用 envsubst 把 `_` 替换为 ${DOMAIN}。

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 上传上限与后端 MAX_UPLOAD_MB=20 对齐。
    client_max_body_size 20m;
    client_body_timeout  60s;
    client_header_timeout 30s;

    # 静态资源压缩；/api 在 location 内单独 gzip off。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/wasm;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # 不向后端透传客户端伪造的 Connection / Upgrade。
    proxy_set_header Connection        "";

    upstream api_backend {
        server backend:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------- HTTP ----
    # 仅用于 ACME HTTP-01 与 301 跳转；健康检查走 80 便于容器内 wget。
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------- HTTPS ----
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- SSE：知识点讲解，必须逐 token 直达客户端 -----------------------
        # 真实路由：POST /api/knowledge-points/{id}/explain（见 backend/app/api/explain.py）。
        # 正则 location 优先于 /api/ 前缀，命中后不再走普通 API 缓冲区。
        location ~ ^/api/knowledge-points/[^/]+/explain$ {
            proxy_pass              http://api_backend;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_cache             off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;

            # 后端已下发同名头，这里先隐藏再统一补发，避免重复。
            proxy_hide_header       X-Accel-Buffering;
            add_header X-Accel-Buffering "no" always;
            gzip off;
        }

        # ---- 通用 API ------------------------------------------------------
        location /api/ {
            proxy_pass http://api_backend;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # 代理层压缩会打乱 SSE 分帧，API 一律不压缩。
            gzip off;
        }

        # ---- 静态资源（带指纹的可长缓存） ---------------------------------
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # ---- SPA 回退 ------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
    }
}
